<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Reservas de embarcações que conectam clientes e barcos.">
    <title>Locações — Titanic Náutica</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="css/locacoes.css">
</head>

<body class="d-flex flex-column min-vh-100">

    <div id="cabecalho"></div>

    <main class="flex-grow-1">
        <div class="container py-5">
            <div class="d-flex flex-column flex-sm-row justify-content-between align-items-sm-center gap-2 mb-3">
                <div>
                    <h1 class="h3 mb-1">Locações</h1>
                    <p class="text-secondary mb-0">Reservas que conectam clientes e embarcações.</p>
                </div>
                <button type="button" class="btn btn-primary align-self-start" id="nova-locacao">
                    Nova locação
                </button>
            </div>

            <div id="mensagens" class="mb-3"></div>

            <div class="card mb-3">
                <div class="card-body">
                    <div class="row g-3 align-items-end">
                        <div class="col-12 col-md-7">
                            <label for="busca-locacao" class="form-label">Buscar por cliente</label>
                            <input id="busca-locacao" type="search" class="form-control" placeholder="Nome do cliente">
                        </div>
                        <div class="col-6 col-md-3">
                            <label for="filtro-locacao" class="form-label">Status</label>
                            <select id="filtro-locacao" class="form-select">
                                <option value="">Todos</option>
                                <option value="ativa">Ativa</option>
                                <option value="finalizada">Finalizada</option>
                                <option value="cancelada">Cancelada</option>
                            </select>
                        </div>
                        <div class="col-6 col-md-2">
                            <p class="text-secondary small mb-1" id="contador-locacoes"></p>
                        </div>
                    </div>
                </div>
            </div>

            <div class="card d-none" id="card-locacoes">
                <div id="lista-locacoes"></div>
            </div>

            <div class="text-center py-5 d-none" id="locacoes-vazio">
                <h2 class="h5">Nenhuma locação encontrada</h2>
                <p class="text-secondary mb-0">Cadastre uma locação ou ajuste os filtros.</p>
            </div>
        </div>

        <section class="container pb-5">
            <h2 class="h4 mb-2">Escolha o tema</h2>
            <div class="btn-group" role="group" aria-label="Basic example">
                <button type="button" class="btn btn-outline-primary" id="btn-tema-padrao">Tema padrão</button>
                <button type="button" class="btn btn-dark" id="btn-tema-escuro">Tema escuro</button>
            </div>
        </section>
    </main>

    <div class="modal fade" id="modalLocacao" tabindex="-1" aria-labelledby="titulo-modal-locacao" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
            <div class="modal-content">
                <form id="form-locacao" class="needs-validation" novalidate>
                    <div class="modal-header">
                        <h2 class="modal-title fs-5" id="titulo-modal-locacao">Nova locação</h2>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
                    </div>
                    <div class="modal-body">
                        <div id="erro-locacao" class="mb-3"></div>
                        <input type="hidden" id="locacao-id">

                        <div class="mb-3">
                            <label for="locacao-cliente" class="form-label">Cliente</label>
                            <select id="locacao-cliente" class="form-select" required></select>
                            <div class="invalid-feedback">Selecione o cliente.</div>
                        </div>

                        <div class="mb-3">
                            <label for="locacao-embarcacao" class="form-label">Embarcação</label>
                            <select id="locacao-embarcacao" class="form-select" required></select>
                            <div class="invalid-feedback">Selecione a embarcação.</div>
                        </div>

                        <div class="row g-3 mb-3">
                            <div class="col-12 col-sm-6">
                                <label for="locacao-inicio" class="form-label">Retirada</label>
                                <input id="locacao-inicio" type="date" class="form-control" required>
                                <div class="invalid-feedback">Informe a data de retirada.</div>
                            </div>
                            <div class="col-12 col-sm-6">
                                <label for="locacao-fim" class="form-label">Devolução</label>
                                <input id="locacao-fim" type="date" class="form-control" required>
                                <div class="invalid-feedback">Informe a data de devolução.</div>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="locacao-status" class="form-label">Status</label>
                            <select id="locacao-status" class="form-select" required>
                                <option value="ativa">Ativa</option>
                                <option value="finalizada">Finalizada</option>
                                <option value="cancelada">Cancelada</option>
                            </select>
                        </div>

                        <div class="alert alert-light border mb-0" id="valor-previsto"></div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">
                            Cancelar
                        </button>
                        <button type="submit" class="btn btn-primary">Salvar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <div id="rodape"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="utils/formatar.js"></script>
    <script src="utils/dados.js"></script>
    <script src="components/header.js"></script>
    <script src="components/footer.js"></script>
    <script src="components/tabela.js"></script>
    <script src="components/alerta.js"></script>
    <script src="components/modalConfirmacao.js"></script>
    <script src="components/tema.js"></script>
    <script src="js/locacoes.js"></script>
</body>

</html>
