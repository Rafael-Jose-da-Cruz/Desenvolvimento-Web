<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Cadastro e gestão dos clientes da Titanic Náutica.">
    <title>Clientes — Titanic Náutica</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="css/clientes.css">
</head>

<body class="d-flex flex-column min-vh-100">

    <div id="cabecalho"></div>

    <main class="flex-grow-1">
        <div class="container py-5">
            <div class="d-flex flex-column flex-sm-row justify-content-between align-items-sm-center gap-2 mb-3">
                <div>
                    <h1 class="h3 mb-1">Clientes</h1>
                    <p class="text-secondary mb-0">Cadastro e gestão dos clientes da Titanic Náutica.</p>
                </div>
                <button type="button" class="btn btn-primary align-self-start" id="novo-cliente">
                    Novo cliente
                </button>
            </div>

            <div id="mensagens" class="mb-3"></div>

            <div class="card mb-3">
                <div class="card-body">
                    <div class="row g-3 align-items-end">
                        <div class="col-12 col-md-7">
                            <label for="busca-cliente" class="form-label">Buscar</label>
                            <input id="busca-cliente" type="search" class="form-control"
                                placeholder="Nome, e-mail ou cidade">
                        </div>
                        <div class="col-12 col-md-5">
                            <p class="text-secondary small mb-0 text-md-end" id="contador-clientes"></p>
                        </div>
                    </div>
                </div>
            </div>

            <div class="card d-none" id="card-clientes">
                <div id="lista-clientes"></div>
            </div>

            <div class="text-center py-5 d-none" id="clientes-vazio">
                <h2 class="h5">Nenhum cliente encontrado</h2>
                <p class="text-secondary mb-0">Cadastre um cliente ou ajuste a busca.</p>
            </div>
        </div>
    </main>

    <div class="modal fade" id="modalCliente" tabindex="-1" aria-labelledby="titulo-modal-cliente" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
            <form id="form-cliente" class="modal-content needs-validation" novalidate>
                <div class="modal-header">
                    <h2 class="modal-title fs-5" id="titulo-modal-cliente">Novo cliente</h2>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
                </div>
                <div class="modal-body">
                    <div id="erro-cliente" class="mb-3"></div>
                    <input type="hidden" id="cliente-id">

                    <div class="mb-3">
                        <label for="cliente-nome" class="form-label">Nome</label>
                        <input id="cliente-nome" type="text" class="form-control" required minlength="3"
                            maxlength="80">
                        <div class="invalid-feedback">Informe o nome do cliente.</div>
                    </div>

                    <div class="mb-3">
                        <label for="cliente-email" class="form-label">E-mail</label>
                        <input id="cliente-email" type="email" class="form-control" required>
                        <div class="invalid-feedback">Informe um e-mail válido.</div>
                    </div>

                    <div class="row g-3 mb-3">
                        <div class="col-12 col-sm-6">
                            <label for="cliente-telefone" class="form-label">Telefone</label>
                            <input id="cliente-telefone" type="tel" class="form-control" required
                                placeholder="(48) 99999-9999">
                            <div class="invalid-feedback">Informe o telefone.</div>
                        </div>
                        <div class="col-12 col-sm-6">
                            <label for="cliente-cpf" class="form-label">CPF</label>
                            <input id="cliente-cpf" type="text" class="form-control" required minlength="11"
                                maxlength="14" placeholder="000.000.000-00">
                            <div class="invalid-feedback">Informe o CPF.</div>
                        </div>
                    </div>

                    <div>
                        <label for="cliente-cidade" class="form-label">Cidade</label>
                        <input id="cliente-cidade" type="text" class="form-control" required maxlength="80">
                        <div class="invalid-feedback">Informe a cidade.</div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">
                        Cancelar
                    </button>
                    <button type="submit" class="btn btn-primary">Salvar</button>
                </div>
            </form>
        </div>
    </div>

    <div id="rodape"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="utils/formatar.js"></script>
    <script src="utils/dados.js"></script>
    <script src="components/header.js"></script>
    <script src="components/footer.js"></script>
    <script src="components/tabela.js"></script>
    <script src="components/alerta.js"></script>
    <script src="components/modalConfirmacao.js"></script>
    <script src="js/clientes.js"></script>
</body>

</html>
